<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Gladihoppers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23231F20'/%3E%3Cpath d='M3 12l8-8 2 2-8 8z' fill='%23d8c9a3'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #231F20;
    touch-action: none; overscroll-behavior: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #231F20;
  }
  #gameContainer { position: relative; overflow: hidden; }
  #gameContainer canvas { display: block; background: #231F20; outline: none; }

  #fsbtn {
    position: fixed; right: 14px; bottom: 14px; z-index: 20;
    width: 38px; height: 38px; display: grid; place-items: center;
    border: 0; border-radius: 8px;
    background: rgba(0,0,0,.45); color: #d8c9a3;
    cursor: pointer; opacity: 0; transition: opacity .3s ease;
  }
  #fsbtn.show { opacity: .55; }
  #fsbtn:hover { opacity: 1; }
  #fsbtn svg { width: 17px; height: 17px; fill: currentColor; }
  :fullscreen #fsbtn { opacity: 0; }
</style>
</head>
<body>

<div id="stage"><div id="gameContainer"></div></div>

<button id="fsbtn" title="Fullscreen (F)" aria-label="Fullscreen">
  <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 0h2v5h-5v-2h3v-3z"/></svg>
</button>

<script>
// The 2019 loader reads window.config while drawing its progress bar, and it only
// does so for a response with no Content-Length. Served straight off disk there is
// always one and the branch never runs; behind a reverse proxy the body arrives
// chunked, the branch runs, and window.config is not there to read - it throws on
// every chunk. It guards cachedDecompressedFileSizes but not config itself.
//
// These files are stored uncompressed (their magic bytes are Unit, the wasm header, and plain js), so the
// decompressed size IS the file size and the bar reads true.
window.config = window.config || {
  cachedDecompressedFileSizes: {
    'Gladihoppers.data.unityweb': 24739996,
    'Gladihoppers.wasm.code.unityweb': 22620489,
    'Gladihoppers.wasm.framework.unityweb': 554679,
  },
};
</script>
<script src="js/poki-sdk.js"></script>
<script src="js/UnityLoader.2019.2.js"></script>
<script src="js/poki-bridge.js"></script>
<script>
(function () {
  var MAX_RATIO = 16 / 9;   // matches the upstream frame config
  var MIN_RATIO = 9 / 16;

  var stage     = document.getElementById('stage');
  var container = document.getElementById('gameContainer');
  var fsbtn     = document.getElementById('fsbtn');

  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var ratio = vw / vh, w, h;

    if (ratio > MAX_RATIO) {          // wider than 16:9 -> pillarbox
      h = vh; w = Math.round(vh * MAX_RATIO);
    } else if (ratio < MIN_RATIO) {   // taller than 9:16 -> letterbox
      w = vw; h = Math.round(vw / MIN_RATIO);
    } else {
      w = vw; h = vh;
    }

    container.style.width  = w + 'px';
    container.style.height = h + 'px';

    var canvas = container.querySelector('canvas');
    if (canvas) {
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
    }
  }

  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });

  if (window.PokiSDK && typeof PokiSDK.init === 'function') { PokiSDK.init(); }

  var instance = window.unityGame = UnityLoader.instantiate('gameContainer', 'Build/Gladihoppers.json');

  // Unity sets its own canvas size at boot; re-apply our box once it exists.
  var settle = setInterval(function () {
    if (container.querySelector('canvas')) { layout(); clearInterval(settle); }
  }, 100);
  setTimeout(function () { clearInterval(settle); }, 30000);

  // --- fullscreen -----------------------------------------------------------
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function toggleFullscreen() {
    var el = document.documentElement;
    if (!isFullscreen()) {
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) req.call(el);
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if (exit) exit.call(document);
    }
    setTimeout(layout, 150);
  }

  var hideTimer;
  function flashButton() {
    fsbtn.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { fsbtn.classList.remove('show'); }, 2600);
  }

  fsbtn.addEventListener('click', function (e) { e.preventDefault(); toggleFullscreen(); });
  window.addEventListener('mousemove', flashButton, { passive: true });

  window.addEventListener('keydown', function (e) {
    // Don't steal keys the game uses; F alone toggles fullscreen.
    if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.altKey && !e.metaKey) {
      toggleFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', layout);
  document.addEventListener('webkitfullscreenchange', layout);

  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>

</body>
</html>
